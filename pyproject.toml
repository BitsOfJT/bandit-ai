[project]
name = "bandit-ai-cli"
version = "0.4.0"
description = "Local-first AI chatbot CLI with a retro cyberpunk aesthetic"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "openai>=1.40",
    "ollama>=0.3",
    "rich>=13",
    "prompt-toolkit>=3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
bandit = "bandit_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bandit_cli"]

# NOTE: Do not use force-include for bandit_cli/data/*.md — in editable
# installs hatch drops a stub package into site-packages that shadows the
# real source tree and breaks `uv run bandit`. Hatchling already ships
# non-.py files that live inside the package directory.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
